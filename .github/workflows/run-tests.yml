name: Run tests

on:
  workflow_call:
    inputs: 
      pharo-versions:
        required: false
        type: string
      image-name:
        required: false
        type: string
      pre-upload-script:
        required: false
        type: string
      create-artifact:
        required: false
        type: boolean
      run-coverage:
        required: false
        type: boolean
env:
  branch-name: ${{ (github.event_name == 'push' && github.ref_name)
    || (github.event_name == 'pull_request' && github.base_ref)
    || (github.event_name == 'release' && github.github.event.release.target_commitish) }}
          
jobs:
  parameters:
    name: Set parameters
    runs-on: ubuntu-latest
    outputs:
      pharo-versions: ${{ steps.pharo-version.outputs.pharo-versions }}
    steps:
      - name: Set Pharo versions
        id: pharo-version
        run: |
          if [ -n "${{ inputs.pharo-versions }}" ]; then
          echo "pharo-versions=${{ inputs.pharo-versions }}" >> $GITHUB_OUTPUT

          elif [ -n "${{ vars.BRANCHES_CONFIGURATION }}" ]; then
          moose_version=$(echo '${{ vars.BRANCHES_CONFIGURATION }}' | jq -r --arg branch "${{ env.branch-name }}" '.[$branch]."moose-version"')
          pharo_versions=$(echo '${{ vars.MOOSE_PHARO_VERSIONS }}' | jq -c --arg mv "$moose_version" '.[$mv]')
          echo "pharo-versions=$pharo_versions" >> $GITHUB_OUTPUT

          else
            pharo_versions=$(echo '${{ vars.MOOSE_PHARO_VERSIONS }}' | jq -c '."Moose-latest"')
            echo "pharo-versions=$pharo_versions" >> $GITHUB_OUTPUT
          fi

  debug: 
    runs-on: ubuntu-latest
    needs: parameters
    steps:
        - run: echo ${{ fromJSON(needs.parameters.outputs.pharo-versions) }}
      
  run:
    runs-on: ubuntu-latest
    needs: parameters
    strategy:
      fail-fast: false
      matrix:
        smalltalk: ${{ fromJSON(needs.parameters.outputs.pharo-versions) }}
    
    name: ${{ matrix.smalltalk }}
    steps:
      - run: echo ${{ matrix.smalltalk }}

