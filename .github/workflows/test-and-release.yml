name: Tests and Release

on:
  workflow_call:
    inputs:
      image-name:
        required: false
        type: string
      pharo-versions:
        required: false
        type: string
      pre-upload-script:
        required: false
        type: string
      release-tag:
        required: false
        type: string
      run-coverage:
        required: false
        type: boolean

env:
  branch-name: ${{ (github.event_name == 'push' && github.ref_name)
    || (github.event_name == 'pull_request' && github.base_ref)
    || (github.event_name == 'release' && github.github.event.release.target_commitish) }}

jobs:
  run-tests:
    name: Run tests
    uses: ./.github/workflows/run-tests.yml
    with:
      image-name: ${{ inputs.image-name }}
      pharo-versions: ${{ inputs.pharo-versions }}
      pre-upload-script: ${{ inputs.pre-upload-script }}
      create-artifact: true
      run-coverage: ${{ inputs.run-coverage }}
  
  update-release:
    name: Update ${{ inputs.release-tag }} release
    if: ${{ always() }}
    needs: run-tests
    uses: ./.github/workflows/update-release.yml
    with:
       image-name: ${{ inputs.image-name }}
       release-tag: ${{ inputs.release-tag }}
       branch-name: branch-name
